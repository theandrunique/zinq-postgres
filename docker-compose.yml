version: '3.8'

services:
  mailhog:
    image: mailhog/mailhog
    ports:
      - 1025:1025
      - 8025:8025

  minio:
    image: quay.io/minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    command: [ "server", "--console-address", ":9001", "/data" ]
    volumes:
      - data_minio:/data
    environment:
      MINIO_ROOT_USER: miniopass
      MINIO_ROOT_PASSWORD: miniopass
      MINIO_DEFAULT_BUCKETS: zinq

  minio-buckets:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set dockerminio http://minio:9000 miniopass miniopass;
      /usr/bin/mc mb dockerminio/zinq;
      /usr/bin/mc anonymous set public dockerminio/zinq;
      exit 0;
      "

  nats:
    image: nats:latest
    ports:
      - "8222:8222"
      - "4222:4222"
    command: "-js -sd /data"
    volumes:
      - nats_data:/data

volumes:
  data_minio:
  nats_data:
