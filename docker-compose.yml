services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zinq
    volumes:
      - data_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zinq"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  mailhog:
    image: mailhog/mailhog
    ports:
      - 1025:1025
      - 8025:8025

  rustfs:
    image: rustfs/rustfs:1.0.4
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console
    volumes:
      - data_rustfs:/data
      - logs_rustfs:/logs
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  rustfs-bucket:
    image: amazon/aws-cli:latest
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command:
      - -c
      - "aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket zinq >/dev/null 2>&1 || aws --endpoint-url http://rustfs:9000 s3 mb s3://zinq"
    restart: "no"

  nats:
    image: nats:latest
    ports:
      - "8222:8222"
      - "4222:4222"
    command: "-js -sd /data"
    volumes:
      - nats_data:/data

volumes:
  data_postgres:
  data_rustfs:
  logs_rustfs:
  nats_data:
