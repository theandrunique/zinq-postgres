name: CI Checks (build & tests)

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - dev

jobs:
  backend-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (linting)
        run: cargo clippy

      - name: Generate JWT signing key
        run: |
          mkdir -p keys
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out keys/key.pem

      - name: Run tests
        run: cargo run --bin test

  frontend-check:
    name: SvelteKit Build & Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: SvelteKit Type Check & Lint
        working-directory: ./frontend
        run: npm run check

      - name: Build SPA
        working-directory: ./frontend
        run: npm run build
